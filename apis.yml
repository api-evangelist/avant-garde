name: Avant-Garde Health
description: 'Avant-Garde Health is a healthcare data analytics company that helps
  hospitals, ambulatory surgery centers (ASCs), and physicians identify cost-reduction
  and quality-improvement opportunities in surgical care. Its CareMeasurement platform
  ingests electronic medical record (EMR), financial, and patient-reported outcomes
  data, combines it with claims data and proprietary algorithms, and applies time-driven
  activity-based costing (TDABC) so care teams can drill into clinical, financial,
  and operational detail, benchmark performance across departments and institutions,
  and drive value-based improvement. Products span surgical cost management, surgical
  coding optimization, surgical quality and outcomes optimization (ERAS), PACU and
  OR throughput, and CMS TEAM support. Surfaced as a General Catalyst portfolio company
  and added to the API Evangelist network; no public developer API surface was found
  at enrichment time.'
